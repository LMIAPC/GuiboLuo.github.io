research:
  eyebrow: 01 / RESEARCH
  heading: Research directions that connect
  intro: Our work spans medical image analysis, physiological and behavioral modeling, and the training and development of large AI models. These four directions are closely connected.
  footnote: We welcome ideas that cross these boundaries, especially when they address a clear research question and can be tested rigorously.
  items:
    - number: '01'
      category: Medical Imaging AI
      heading: Intelligent Medical Image Analysis
      text: We develop methods for lesion detection and segmentation, disease recognition, quantitative analysis, and risk assessment using multi-center and multimodal medical imaging data, with a focus on generalization across heterogeneous clinical environments and real-world applicability.
      featured: true
    - number: '02'
      category: Physiological & Behavioral Intelligence
      heading: EEG and Multimodal Physiological-Behavioral Modeling
      text: We investigate temporal representation learning, multimodal fusion, human-state estimation, and behavioral understanding by integrating EEG, ECG, eye-tracking, video, and other physiological and behavioral signals, with an emphasis on generalization across individuals and real-world settings.
      featured: true
    - number: '03'
      category: Multimodal Foundation Models
      heading: Multimodal Foundation Models & Efficient Training and Reasoning
      text: We explore unified representations and cross-modal alignment across vision, language, and physiological signals, alongside foundation model pretraining, reinforcement learning-based post-training, knowledge distillation, advanced reasoning, and inference optimization to improve model capabilities and computational efficiency.
      featured: false
    - number: '04'
      category: Trustworthy Collaborative Learning
      heading: Federated Learning & Privacy-Preserving AI
      text: We study personalized federated learning, privacy-preserving methods, communication-efficient collaboration, knowledge transfer, and federated foundation models, addressing data heterogeneity, privacy constraints, and decentralized learning to enable trustworthy and efficient AI across institutions and distributed environments.
      featured: false
positions:
  eyebrow: 02 / OPPORTUNITIES
  heading: Find a research path that fits you
  intro: We welcome prospective researchers from China and abroad, including postdoctoral researchers, PhD and master’s students, and undergraduate research interns. The scope and eligibility of each opportunity depend on the host programme and your career stage.
  detail_heading: Background, responsibilities & growth
  detail_intro: Select a role to see what we value and the kind of work you could pursue. Research milestones are aspirations, not universal admission or graduation requirements.
  footnote: Openings, funding, compensation, admissions eligibility, degree arrangements, and any programme-specific language requirements are subject to the current policies of the relevant host institution and programme. International applicants should consult official admission or appointment information.
  roles:
    - id: postdoc
      number: '01'
      name: Postdoctoral Researchers
      summary: Shape an independent research agenda while working across AI and biomedical disciplines.
      label: Independent research & collaboration
      subtitle: Research leadership · Collaboration · Mentorship
      look_for_label: Who may be a good fit
      look_for:
        - A PhD in computer science, artificial intelligence, electrical or electronic engineering, biomedical engineering, clinical medicine, or a related field, with research experience relevant to our work.
        - Evidence that you can identify important questions, design convincing experiments, interpret results, and lead scientific writing.
        - Strong representative research contributions; experience collaborating across disciplines is welcome.
      develop_label: Research scope & development
      develop:
        - Lead research projects aligned with the group’s interests while developing a distinct scholarly identity.
        - Take part in research proposals and collaborations, and contribute to mentoring junior researchers.
        - Work toward a small body of substantial contributions—for example, two or three representative research outputs over a suitable appointment period—rather than optimizing for publication count.
      note_label: Research expectations
      note: The research plan will be developed together, taking account of appointment length, project maturity, and your longer-term career goals.
      compensation:
        label: POSTDOCTORAL COMPENSATION
        amount: RMB 400,000–600,000 total annual compensation
        qualifier: ' (for eligible outstanding candidates; actual compensation and its components depend on qualifications, appointment category, and host-institution policy).'
    - id: phd
      number: '02'
      name: PhD Students
      summary: Pursue a connected set of research questions and grow into an independent researcher.
      label: Original research & sustained inquiry
      subtitle: Research depth · Original thinking · Scientific independence
      look_for_label: Who may be a good fit
      look_for:
        - A sound foundation in mathematics, programming, and machine learning, with a willingness to keep learning.
        - Intellectual curiosity, initiative, and the resilience to pursue a difficult problem over time.
        - Previous papers or projects are useful, but we place greater weight on your specific contributions, reasoning, and research potential.
      develop_label: Research scope & development
      develop:
        - Build a coherent thesis direction around related problems, rather than a collection of disconnected projects.
        - As a flexible aspiration, develop a connected body of roughly three to five strong papers during the PhD; originality, rigor, and impact matter more than the number.
        - Progressively take ownership of research design, experimentation, writing, collaboration, and mentoring of junior students.
      note_label: Research expectations
      note: These milestones are adjusted to your preparation, progress, and interests; paper counts are not a standalone measure of success or a statement of degree requirements.
    - id: master
      number: '03'
      name: Master’s Students
      summary: Gain hands-on experience by taking a research or research-engineering project from question to evidence.
      label: Research & engineering practice
      subtitle: Method development · Reproducible systems · Practical experience
      look_for_label: Who may be a good fit
      look_for:
        - Some preparation in mathematics, programming, or AI, together with an interest in developing these skills.
        - Reliability, a willingness to learn, and genuine interest in scientific research or research engineering.
      develop_label: Research scope & development
      develop:
        - Complete a reasonably self-contained research or research-engineering project, independently or as part of a team.
        - Produce a verifiable result, which might be a paper, a reusable training or evaluation framework, a model, or a working research prototype.
        - Learn how to design experiments, reproduce findings, document work, and communicate results clearly.
      note_label: How we assess progress
      note: Rigorous research and well-executed research engineering are both valued. A paper is not the only meaningful outcome.
    - id: intern
      number: '04'
      name: Undergraduate Research Interns
      summary: Explore what research is really like through reading, implementation, and careful experiments.
      label: Learn by doing
      subtitle: Research foundations · Curiosity · Remote options by arrangement
      look_for_label: Who may be a good fit
      look_for:
        - Primarily second- and third-year undergraduates with basic programming skills and genuine curiosity about research.
        - An initial commitment of at least three months is recommended; timing can be discussed around coursework and other commitments.
        - No publications are expected. We value questions, consistent communication, and honest reporting of results.
      develop_label: Research scope & development
      develop:
        - Understand and reproduce a representative research method or experiment.
        - Carry out a reproducible benchmark, robustness assessment, or failure-case study.
        - Write a short, evidence-based account of what worked, what did not, and what you would investigate next.
      note_label: Research outcomes
      note: A publication is neither required nor promised. Longer-term involvement may be possible depending on research fit, supervision capacity, and applicable policies.
values:
  eyebrow: 03 / HOW WE WORK
  heading: A culture of curiosity and rigor
  intro: Strong research outcomes matter, but so do the questions we ask, the evidence we gather, and how we work with others.
  items:
    - number: '01'
      heading: Curiosity
      text: Ask why an approach works, where it breaks down, and what remains unexplained.
    - number: '02'
      heading: Independent thinking
      text: Question assumptions and develop ideas that can be tested, rather than stopping at reproduced results.
    - number: '03'
      heading: Scientific rigor
      text: Value reproducibility, sound evaluation, negative results, and clear acknowledgment of limitations.
    - number: '04'
      heading: Ownership
      text: Take initiative, communicate clearly, and be accountable for your methods, claims, and collaborations.
  ai_note: We welcome the responsible use of AI tools for learning and coding. Researchers must still exercise independent judgment, understand their methods, verify findings, and uphold research integrity.
support:
  eyebrow: 04 / RESEARCH ENVIRONMENT
  heading: An environment for sustained research
  intro: We aim to give researchers the technical resources, interdisciplinary connections, and stage-appropriate mentorship needed to pursue substantial work.
  items:
    - Access to high-performance GPU computing resources for large-model and multimodal research.
    - Opportunities to collaborate with researchers in computer science, AI, biomedicine, and clinical settings.
    - International academic exchanges and research visits may be available for eligible group members, depending on partner arrangements and available support.
    - Guidance tailored to career stage, with an emphasis on growing research independence and long-term development.
apply:
  eyebrow: 05 / HOW TO APPLY
  heading: Start a conversation
  intro: A focused email that shows what you have worked on and what you hope to investigate is more helpful than a generic statement of interest.
  email_label: CONTACT
  email: luogb at pku dot edu dot cn
  items:
    - heading: Postdoctoral and graduate enquiries
      text: Please send your CV and a brief note on your research interests, your personal contribution to one or two representative projects, and the questions you would like to explore. Links to papers, code, or project pages are welcome.
    - heading: Undergraduate research enquiries
      text: Briefly describe relevant coursework and programming experience, anything you have read or reproduced, the questions that interest you, and the time you could commit.
  button_label: Email the group
  button_url: mailto:luogb@pku.edu.cn?subject=%5BResearch%20Opportunity%5D%20Guibo%20Luo%20Group
  footer: Please include your name and the opportunity type in the email subject. Enquiries are reviewed for research fit and available supervision capacity.
