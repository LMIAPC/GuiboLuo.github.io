research:
  eyebrow: 01 / 研究方向
  heading: 围绕重要问题开展长期研究
  intro: 聚焦医学影像、生理行为建模及大模型关键技术，围绕四个相互关联的方向开展研究。
  footnote: 我们鼓励跨方向合作，重视研究问题之间的联系、可靠的实验依据以及持续积累的科学贡献。
  items:
    - number: '01'
      category: 医学影像智能
      heading: 医学影像数据智能分析
      text: 面向多中心、多模态医学影像，研究病灶检测与分割、疾病识别、定量分析和风险评估，提升方法在不同数据环境下的泛化能力与临床应用价值。
      featured: true
    - number: '02'
      category: 生理行为建模
      heading: 脑电及多模态生理行为建模
      text: 融合脑电、心电、眼动、视频等生理与行为数据，研究时序表征学习、多模态融合、个体状态估计、行为理解及跨场景泛化。
      featured: true
    - number: '03'
      category: 多模态基础模型
      heading: 多模态大模型与训练推理优化
      text: 研究视觉、语言及生理信号的统一表征与跨模态对齐、大模型预训练、强化学习后训练、知识蒸馏、复杂推理与推理加速，兼顾模型能力与计算效率。
      featured: false
    - number: '04'
      category: 可信协同学习
      heading: 联邦学习与隐私计算
      text: 面向数据异构、隐私约束和跨机构协作场景，研究联邦学习、隐私保护、通信高效协同、知识迁移及联邦基础模型，实现多机构数据环境下可信、高效的协同智能。
      featured: false
positions:
  eyebrow: 02 / 招生与招聘
  heading: 寻找适合你的研究机会
  intro: 我们欢迎博士后研究人员、博士生、硕士生及本科科研实习生。不同阶段的研究职责和培养重点各有侧重。
  detail_heading: 申请条件与发展方向
  detail_intro: 点击岗位查看背景要求、研究目标与成长方向。所列成果目标是培养与发展的参考，并非统一的录取或毕业门槛。
  footnote: 实际招聘岗位、招生名额、经费资助、薪酬及申请资格以相关学校、聘任单位和项目的当期规定为准。
  roles:
    - id: postdoc
      number: '01'
      name: 博士后研究人员
      summary: 独立开展研究，推动有延续性的学术方向和跨学科合作。
      label: 独立研究与学术合作
      subtitle: 独立研究 · 学术合作 · 指导培养
      look_for_label: 我们期待你具备
      look_for:
        - 拥有计算机科学、人工智能、电子工程、生物医学工程、临床医学或相关领域的博士学位，研究背景与团队方向相契合。
        - 能够发现有价值的研究问题，独立设计实验、分析结果并主导学术论文写作。
        - 具有代表性高质量科研成果，以及跨学科合作或团队协作经验者优先。
      develop_label: 研究目标与成长方向
      develop:
        - 围绕共同关注的重要问题牵头研究课题，逐步形成具有个人特色的研究方向。
        - 参与科研项目申报、跨学科合作及青年学生指导，提升独立研究和学术组织能力。
        - 根据聘期和课题进展，争取形成 2–3 项具有代表性的高质量成果，建立持续发展的学术积累。
      note_label: 关于科研目标
      note: 具体目标将结合聘期、研究基础和个人职业规划共同商定，不以单纯的论文数量衡量研究价值。
      compensation:
        label: 博士后待遇
        amount: 综合年收入人民币 40万–60万元
        qualifier: （适用于符合条件的优秀博士后；实际待遇及其构成以个人资历、聘任类别和单位政策为准）。
    - id: phd
      number: '02'
      name: 博士研究生
      summary: 围绕有价值的科学问题深入探索，逐步形成连贯的个人研究主线。
      label: 长期研究与原创探索
      subtitle: 原创探索 · 独立思考 · 科研积累
      look_for_label: 我们期待你具备
      look_for:
        - 具备良好的数学、编程及机器学习基础，并愿意持续提升研究能力。
        - 具有主动探索问题的意识、求知欲，以及面对复杂问题时持续钻研的耐心。
        - 已有论文或项目经历是加分项，但我们更看重实际个人贡献、独立思考与研究潜力。
      develop_label: 研究目标与成长方向
      develop:
        - 围绕相互关联的研究问题逐步建立清晰的学术主线，而非仅完成彼此割裂的短期课题。
        - 以博士阶段形成 3–5 篇相互关联的高质量论文作为努力方向，更重视原创贡献、论文质量及整体研究影响。
        - 逐步独立承担研究设计、实验验证、论文写作、合作交流及指导低年级学生等工作。
      note_label: 关于科研目标
      note: 科研目标将结合个人基础、项目进展和发展规划灵活调整；论文数量不是机械化的培养考核标准。
    - id: master
      number: '03'
      name: 硕士研究生
      summary: 通过相对完整的科研项目，建立研究方法和工程实践能力。
      label: 科研探索与工程实践
      subtitle: 研究方法 · 可复现系统 · 项目实践
      look_for_label: 我们期待你具备
      look_for:
        - 具备一定的数学、编程或人工智能基础，愿意进一步提升相关能力。
        - 认真负责、乐于学习，对科学研究或科研工程具有持续兴趣。
      develop_label: 研究目标与成长方向
      develop:
        - 独立或与团队合作完成一项相对完整的科研或科研工程项目，形成可检验的研究成果。
        - 成果形式可以是学术论文、可复用的训练或评测框架、模型，或研究系统原型。
        - 掌握实验设计、结果复现、技术文档撰写和学术表达的基本方法。
      note_label: 关于成果形式
      note: 我们同样重视严谨的研究工作与高质量科研工程实践，不以发表论文作为唯一评价标准。
    - id: intern
      number: '04'
      name: 本科科研实习生
      summary: 从阅读、复现和实验分析入手，培养科研兴趣与基本研究能力。
      label: 从研究实践中学习
      subtitle: 科研入门 · 兴趣培养 · 远程参与可商议
      look_for_label: 我们期待你具备
      look_for:
        - 主要面向大二、大三本科生；具备基本编程能力，并对研究问题保持真正的好奇心。
        - 建议首次参与不少于 3 个月，具体安排可结合课程与个人情况协商。
        - 不要求已有论文；希望能够主动提问、定期沟通进展，并如实记录实验结果。
      develop_label: 研究目标与成长方向
      develop:
        - 理解并复现一项有代表性的研究方法或实验。
        - 开展一项可复现的基准测试、稳健性评估或失败案例分析。
        - 形成一份基于证据的简短总结，说明实验发现、局限及下一步计划。
      note_label: 关于实习成果
      note: 本科科研实习不要求或承诺论文发表。表现优秀者可根据研究契合度、指导资源及相关规定继续参与长期项目。
values:
  eyebrow: 03 / 科研理念
  heading: 鼓励探索、严谨求实的团队文化
  intro: 我们追求高质量研究成果，也重视问题意识、研究过程与相互合作。
  items:
    - number: '01'
      heading: 好奇心
      text: 主动思考方法为何有效、在什么条件下失效，以及还有哪些尚未解决的问题。
    - number: '02'
      heading: 独立思考
      text: 不满足于复现结果，敢于质疑已有假设并提出可检验的新想法。
    - number: '03'
      heading: 严谨求实
      text: 重视实验可复现性与客观证据，认真分析负面结果和研究局限。
    - number: '04'
      heading: 责任意识
      text: 主动推进工作，清晰沟通问题与进展，对研究结论和合作承诺负责。
  ai_note: 欢迎合理使用 AI 工具辅助学习与编程，但研究者仍需保持独立判断、理解研究方法、核实结果，并对学术诚信负责。
support:
  eyebrow: 04 / 科研环境
  heading: 支持长期科研探索与实际应用
  intro: 团队重视科研资源、跨学科合作与分阶段指导，为独立研究和持续发展提供支持。
  items:
    - 高性能 GPU 计算资源，以及开展大模型和多模态研究的相关条件。
    - 与计算机、人工智能、生物医学及临床研究团队开展跨学科合作的机会。
    - 根据合作安排、个人条件和可用支持，为优秀成员争取赴国际高水平高校开展学术交流与研究访问的机会。
    - 结合个人研究阶段提供指导，鼓励学术独立性、团队合作与长期职业发展。
apply:
  eyebrow: 05 / 联系与申请
  heading: 欢迎联系与申请
  email_label: 联系邮箱
  email: luogb at pku dot edu dot cn
  items:
    - heading: 博士后及研究生申请者
      text: 请附个人简历，简述研究兴趣、代表性工作中的个人贡献，以及希望探索的问题；如有论文、代码或项目页面，可提供链接。
    - heading: 本科科研实习申请者
      text: 请简要介绍相关课程与编程基础、已阅读或复现的研究工作、感兴趣的问题，以及可以投入科研的时间。
  button_label: 发送申请邮件
  button_url: mailto:luogb@pku.edu.cn?subject=%5BResearch%20Opportunity%5D%20Guibo%20Luo%20Group
  footer: 请在邮件主题中注明申请类别和姓名。我们将综合考虑研究方向契合度与实际指导资源。
  intro: 建议通过一封简洁、具体的邮件介绍自己的研究背景和兴趣，无需准备冗长的套话式申请材料。
